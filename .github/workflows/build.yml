name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - name: Generate project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/prank/reaction app/src/main/res/mipmap-xxxhdpi
          cp index.html screamer.mp4 icon.png app/src/main/assets/
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Reaction"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '9.3.1' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.prank.reaction'
            compileSdk 34
            defaultConfig {
              applicationId 'com.prank.reaction'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="Тест реакции" android:icon="@mipmap/ic_launcher"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/prank/reaction/MainActivity.java <<'EOF'
          package com.prank.reaction;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebChromeClient(new WebChromeClient());
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onPause() { super.onPause(); w.onPause(); }
            @Override protected void onResume() { super.onResume(); w.onResume(); }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: reaction-apk
          path: app/build/outputs/apk/debug/app-debug.apk
